name: Validate Trees & Surfaces

on:
  push:
  pull_request:
  workflow_dispatch:
  # The network-dependent live-API refresh check below only runs on dispatch
  # and schedule. It was dispatch-only until 2026-10-14, which let an upstream
  # managed-tree identifier re-key break the refresh pipeline unnoticed while
  # push-triggered CI stayed green. This weekly run is the rot detector.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  actions: write # lets julia-actions/cache rotate its own old depot caches

concurrency:
  # Rapid pushes to a PR branch supersede each other; main and the weekly
  # rot-detector run to completion.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'schedule' }}

jobs:

  validate-canopy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned uv in an isolated tooling environment
        run: |
          python3 -m venv "$RUNNER_TEMP/canopy-tools"
          "$RUNNER_TEMP/canopy-tools/bin/pip" install uv==0.13.0
          echo "$RUNNER_TEMP/canopy-tools/bin" >> "$GITHUB_PATH"
      - name: Validate canopy geometry and provenance without upstream datasets
        run: scripts/validate-canopy.sh

  validate-imagery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned uv in an isolated tooling environment
        run: |
          python3 -m venv "$RUNNER_TEMP/imagery-tools"
          "$RUNNER_TEMP/imagery-tools/bin/pip" install uv==0.13.0
          echo "$RUNNER_TEMP/imagery-tools/bin" >> "$GITHUB_PATH"
      - name: Validate imagery registration on synthetic fixtures without downloads
        run: scripts/validate-imagery.sh

  validate-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned uv in an isolated tooling environment
        run: |
          python3 -m venv "$RUNNER_TEMP/docs-tools"
          "$RUNNER_TEMP/docs-tools/bin/pip" install uv==0.13.0
          echo "$RUNNER_TEMP/docs-tools/bin" >> "$GITHUB_PATH"
      # Documentation defects are the ones this project kept hitting: a claim that a
      # comparison had never run after it had, and a candidate described as an
      # independent check of a class derived from that very product.
      - name: Validate documentation references and pinned claims
        run: scripts/validate-docs.sh

  validate-julia:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Julia
        uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2.7.0
        with:
          version: "1.10"

      - name: Restore Julia depot cache
        uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2

      - name: Validate Julia UI
        run: scripts/validate-julia.sh

  validate-julia-refresh:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Julia
        uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2.7.0
        with:
          version: "1.10"

      - name: Check live public API contracts
        run: JULIA_REFRESH_CHECK=1 scripts/validate-julia.sh

  validate-julia-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Julia UI container
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          tags: trees-surfaces-julia:ci
          load: true
          # GitHub runners have no local Docker layer cache, so without this
          # the Pkg.instantiate() layer rebuilds from scratch every push.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test Julia UI container
        run: |
          set -euo pipefail
          container=$(docker run -d -p 18080:8080 trees-surfaces-julia:ci)
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ready=false
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          [[ "$ready" == true ]]
          [[ $(docker exec "$container" id -u) != 0 ]]
          curl -fsS http://127.0.0.1:18080/health | grep -Fx ok >/dev/null
          curl -fsS 'http://127.0.0.1:18080/api/screen?heat=0&proximity=100' | grep -F vbx_56876 >/dev/null
